[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fh-mahjong-ai"
version = "0.1.0"
description = "Python RL training stack for Fenghua Mahjong"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "grpcio-tools>=1.81.1",
  "mlflow>=3.0",
  "numpy>=2.0",
  "protobuf>=5.0",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
fh-mj-selfplay-smoke = "fh_mahjong_ai.scripts.selfplay_smoke:main"
fh-mj-generate-data = "fh_mahjong_ai.scripts.generate_data:main"
fh-mj-generate-selfplay = "fh_mahjong_ai.scripts.generate_selfplay:main"
fh-mj-dataset-diagnostics = "fh_mahjong_ai.scripts.dataset_diagnostics:main"
fh-mj-replay-policy-diagnostics = "fh_mahjong_ai.scripts.replay_policy_diagnostics:main"
fh-mj-generate-branch-counterfactuals = "fh_mahjong_ai.scripts.generate_branch_counterfactuals:main"
fh-mj-generate-sampled-branch-counterfactuals = "fh_mahjong_ai.scripts.generate_sampled_branch_counterfactuals:main"
fh-mj-generate-targeted-branch-counterfactuals = "fh_mahjong_ai.scripts.generate_targeted_branch_counterfactuals:main"
fh-mj-branch-cf-calibration = "fh_mahjong_ai.scripts.branch_cf_calibration:main"
fh-mj-branch-cf-diagnostics = "fh_mahjong_ai.scripts.branch_cf_diagnostics:main"
fh-mj-branch-cf-guard-diagnostics = "fh_mahjong_ai.scripts.branch_cf_guard_diagnostics:main"
fh-mj-targeted-branch-cf-diagnostics = "fh_mahjong_ai.scripts.targeted_branch_cf_diagnostics:main"
fh-mj-global-ev-diagnostics = "fh_mahjong_ai.scripts.global_ev_diagnostics:main"
fh-mj-action-ev-branch-cf-calibration = "fh_mahjong_ai.scripts.action_ev_branch_cf_calibration:main"
fh-mj-paired-trace = "fh_mahjong_ai.scripts.paired_trace:main"
fh-mj-paired-trace-q-diagnostics = "fh_mahjong_ai.scripts.paired_trace_q_diagnostics:main"
fh-mj-build-paired-trace-action-ev-data = "fh_mahjong_ai.scripts.build_paired_trace_action_ev_data:main"
fh-mj-convert-data = "fh_mahjong_ai.scripts.convert_data:main"
fh-mj-train-bc = "fh_mahjong_ai.scripts.train_bc:main"
fh-mj-train-awbc = "fh_mahjong_ai.scripts.train_awbc:main"
fh-mj-train-iql = "fh_mahjong_ai.scripts.train_iql:main"
fh-mj-train-global-ev = "fh_mahjong_ai.scripts.train_global_ev:main"
fh-mj-train-pairwise-delta = "fh_mahjong_ai.scripts.train_pairwise_delta:main"
fh-mj-train-branch-preference-policy = "fh_mahjong_ai.scripts.train_branch_preference_policy:main"
fh-mj-train-action-risk = "fh_mahjong_ai.scripts.train_action_risk:main"
fh-mj-train-offline-q = "fh_mahjong_ai.scripts.train_offline_q:main"
fh-mj-evaluate = "fh_mahjong_ai.scripts.evaluate:main"
fh-mj-compare = "fh_mahjong_ai.scripts.compare_reports:main"
fh-mj-evaluate-risk-guarded = "fh_mahjong_ai.scripts.evaluate_risk_guarded:main"
fh-mj-reward-calibration = "fh_mahjong_ai.scripts.reward_calibration:main"
fh-mj-serve-policy = "fh_mahjong_ai.scripts.serve_policy:main"
fh-mj-reload-policy = "fh_mahjong_ai.scripts.reload_policy:main"
fh-mj-serving-smoke = "fh_mahjong_ai.scripts.serving_smoke:main"
fh-mj-pipeline = "fh_mahjong_ai.scripts.run_pipeline:main"
fh-mj-selfplay-loop = "fh_mahjong_ai.scripts.selfplay_loop:main"
fh-mj-train-ppo = "fh_mahjong_ai.scripts.train_ppo:main"
fh-mj-train-oracle = "fh_mahjong_ai.scripts.train_oracle:main"
fh-mj-train-selfplay-oracle = "fh_mahjong_ai.scripts.train_selfplay_oracle:main"
fh-mj-train-b2b = "fh_mahjong_ai.scripts.train_b2b:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
