name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go caches Go modules and build cache keyed on go.sum.
      # web/embed.go embeds web/dist/*; the tracked stub files in web/dist
      # satisfy the pattern on a fresh checkout, so no frontend build is needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  web:
    name: Web type-check + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      # Same type-check the build script ("tsc && vite build") runs, without
      # paying for the vite production bundle on every PR.
      - name: tsc
        run: npx tsc

      - name: vitest
        run: npx vitest run
